[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,assets/source/*,assets/*.py"
export_path="../../public/games/berry-fighter/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/manifest_name="Berry Fighter"
progressive_web_app/manifest_short_name="Berry Fighter"
progressive_web_app/manifest_description="An original Berry Arcade garden platform fighter"
progressive_web_app/manifest_theme_color=Color(0.05, 0.14, 0.18, 1)
progressive_web_app/background_color=Color(0.05, 0.14, 0.18, 1)

[preset.1]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,assets/source/*,assets/*.py"
export_path="build/BerryFighter.exe"

[preset.1.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
